<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTubeDownloader</title>
    <link rel="stylesheet" href="youtubedownloader.css">
</head>
<body>
    <nav class="tab-bar">
        <div class="tab-title">
            <h1>YouTubeダウンローダー</h1> 
        </div>
        <div class="tab-links">
            <a href="../index.html">ホーム</a>
            <a href="../proxy.html">プロキシサーバー</a>
        </div>
    </nav>
    <main>
        <div class="card">
            <form id="download-form" class="form-group">
                <input
                    type="text"
                    id="url-input"
                    name="url"
                    placeholder="https://www.youtube.com/watch?v=abcdef"
                    required
                >
                <button type="submit" id="download-button">ダウンロードする</button>
            </form>
        </div>
        <div id="console" class="console" hidden></div>
    </main>
    <footer>
        <p>&copy; keikyudamasii All Rights Reserved.</p>
    </footer>
    <script src="youtubedownloader.js"></script>
</body>
</html>
