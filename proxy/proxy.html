<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Proxy Server</title>
    <link rel="stylesheet" href="proxy.css">
</head>
<body>
    <div class="card">
        <h1>Web Proxy</h1>

                type="text" 
                name="url" 
                placeholder="https://example.com" 
                required
            >
            <button type="submit">閲覧する</button>
        </form>
    </div>
    <script src="proxy.js"></script>
</body>
</html>
