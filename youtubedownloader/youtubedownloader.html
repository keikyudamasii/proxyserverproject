<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTubeDownloader</title>
    <link rel="stylesheet" href="youtubedownloader.css">
</head>
<body>
    <div class="card">
        <h1>YouTubeDownloader</h1>
        <form action="/fetch" method="GET" class="form-group">
            <input 
                type="text" 
                name="url" 
                placeholder="https://www.youtube.com/watch?v=abcdef" 
                required
            >
            <button type="submit">ダウンロードする</button>
        </form>
    </div>
    <script src="youtubedownloader.js"></script>
</body>
</html>
